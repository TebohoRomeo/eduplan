<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Center Login — Edulution</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="auth-card">
        <h1>Edulution Session Planner</h1>
        <p class="muted">Center Login — enter your center name and code to view saved sessions.</p>

        <form id="loginForm">
          <label for="centerName">Center name</label>
          <input id="centerName" name="centerName" placeholder="Center name" required />

          <label for="centerCode">Center code</label>
          <input id="centerCode" name="centerCode" placeholder="Center code" required />

          <div class="form-actions">
            <button type="submit">Login</button>
          </div>
        </form>
      </div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
